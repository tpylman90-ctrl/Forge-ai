name: Build Android debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Forge
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Get pinned llama.cpp Android engine
        run: bash scripts/setup-llama.sh
      - name: Bundle Apache-2.0 Qwen3 GGUF for offline first launch
        run: |
          python -m pip install --disable-pip-version-check --quiet "huggingface_hub>=0.29,<2"
          python scripts/bundle-model.py
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Compile debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forge-ai-g1-polish-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
